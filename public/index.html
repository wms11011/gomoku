<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏大厅 · Game Lobby</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="lobby">
  <header class="site-header">
    <h1>游戏大厅</h1>
    <p class="subtitle">G A M E &nbsp; L O B B Y</p>
  </header>

  <main class="lobby-grid">
    <a class="game-card" href="/gomoku.html">
      <div class="game-icon gomoku-icon">
        <span class="stone b"></span>
        <span class="stone w"></span>
        <span class="stone b s2"></span>
        <span class="stone w s3"></span>
      </div>
      <h2>五子棋</h2>
      <p>人机对战 · 联机对战 · 本地双人</p>
      <span class="play-btn">进入游戏 →</span>
    </a>

    <a class="game-card" href="/tetris.html">
      <div class="game-icon tetris-icon">
        <span></span><span></span><span></span><span></span>
      </div>
      <h2>俄罗斯方块</h2>
      <p>经典消除 · 立体方块 · 炫酷特效</p>
      <span class="play-btn">进入游戏 →</span>
    </a>

    <a class="game-card" href="/snake.html">
      <div class="game-icon snake-icon">
        <span></span><span></span><span></span><span></span>
      </div>
      <h2>贪吃蛇</h2>
      <p>霓虹街机 · 模拟摇杆 · 越吃越快</p>
      <span class="play-btn">进入游戏 →</span>
    </a>
  </main>

  <footer class="lobby-footer">选择一款游戏开始畅玩</footer>
</body>
</html>
