<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏大厅 · Game Lobby</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="lobby">
  <header class="site-header">
    <h1>游戏大厅</h1>
    <p class="subtitle">G A M E &nbsp; L O B B Y</p>
  </header>

  <main class="lobby-grid">
    <a class="game-card" href="/gomoku.html">
      <div class="game-icon gomoku-icon">
        <span class="stone b"></span>
        <span class="stone w"></span>
        <span class="stone b s2"></span>
        <span class="stone w s3"></span>
      </div>
      <h2>五子棋</h2>
      <p>人机对战 · 联机对战 · 本地双人</p>
      <span class="play-btn">进入游戏 →</span>
    </a>

    <a class="game-card" href="/tetris.html">
      <div class="game-icon tetris-icon">
        <span></span><span></span><span></span><span></span>
      </div>
      <h2>俄罗斯方块</h2>
      <p>经典消除 · 立体方块 · 炫酷特效</p>
      <span class="play-btn">进入游戏 →</span>
    </a>

    <a class="game-card" href="/snake.html">
      <div class="game-icon snake-icon">
        <svg viewBox="0 0 96 96" width="76" height="76" aria-hidden="true">
          <defs>
            <linearGradient id="snk-body" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffcf6e"/>
              <stop offset="1" stop-color="#f2682a"/>
            </linearGradient>
            <linearGradient id="snk-head" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffe9a8"/>
              <stop offset="1" stop-color="#ffb154"/>
            </linearGradient>
          </defs>
          <!-- 身体（三节果冻方块，弯成蛇形） -->
          <rect x="12" y="22" width="24" height="24" rx="7" fill="url(#snk-body)"/>
          <rect x="16" y="25" width="14" height="6" rx="3" fill="rgba(255,255,255,.45)"/>
          <rect x="36" y="22" width="24" height="24" rx="7" fill="#ffb154"/>
          <rect x="40" y="25" width="14" height="6" rx="3" fill="rgba(255,255,255,.45)"/>
          <rect x="36" y="46" width="24" height="24" rx="7" fill="#ff913d"/>
          <rect x="40" y="49" width="14" height="6" rx="3" fill="rgba(255,255,255,.45)"/>
          <!-- 头（朝右，大眼睛） -->
          <rect x="60" y="44" width="27" height="27" rx="8" fill="url(#snk-head)"/>
          <rect x="64" y="47" width="16" height="7" rx="3.5" fill="rgba(255,255,255,.5)"/>
          <circle cx="75" cy="56" r="4.4" fill="#ffffff"/>
          <circle cx="75" cy="66" r="4.4" fill="#ffffff"/>
          <circle cx="76.8" cy="56" r="2" fill="#1c2233"/>
          <circle cx="76.8" cy="66" r="2" fill="#1c2233"/>
          <!-- 魔豆 -->
          <rect x="66" y="8" width="14" height="14" rx="3" fill="#4ff3d8" stroke="#ffffff" stroke-width="2.5"/>
          <rect x="69" y="11" width="5" height="5" rx="1.5" fill="rgba(255,255,255,.9)"/>
        </svg>
      </div>
      <h2>贪吃蛇</h2>
      <p>霓虹街机 · 模拟摇杆 · 越吃越快</p>
      <span class="play-btn">进入游戏 →</span>
    </a>
    <a class="game-card" href="/minecraft.html">
      <div class="game-icon minecraft-icon">
        <svg viewBox="0 0 96 96" width="76" height="76" aria-hidden="true">
          <!-- 等轴测草方块 -->
          <polygon points="48,6 86,27 48,48 10,27" fill="#6aae3f"/>
          <polygon points="10,27 48,48 48,90 10,69" fill="#8a5f3c"/>
          <polygon points="86,27 48,48 48,90 86,69" fill="#6d4a2e"/>
          <polygon points="48,6 86,27 48,48 10,27" fill="none" stroke="#4c8a28" stroke-width="2"/>
          <polygon points="10,27 48,48 48,90 10,69" fill="none" stroke="#5f4126" stroke-width="2"/>
          <polygon points="86,27 48,48 48,90 86,69" fill="none" stroke="#4e3319" stroke-width="2"/>
        </svg>
      </div>
      <h2>迷你世界</h2>
      <p>3D 沙盒 · 随机地形 · 挖方块盖房子</p>
      <span class="play-btn">进入游戏 →</span>
    </a>
  </main>

  <footer class="lobby-footer">选择一款游戏开始畅玩</footer>
</body>
</html>
